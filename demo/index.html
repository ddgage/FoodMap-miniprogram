<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>美食地图 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#f6f6f6;max-width:414px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);width:414px;height:100%;border-left:1px solid #e0e0e0;border-right:1px solid #e0e0e0;pointer-events:none;z-index:9999}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:414px;max-width:100vw;height:50px;background:#fff;display:flex;border-top:1px solid #eee;z-index:1000}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#999;cursor:pointer;transition:color .2s}
.tab-item.active{color:#07C160}
.tab-item .tab-icon{font-size:20px;margin-bottom:1px}

.page{display:none;padding-bottom:60px;min-height:100vh}
.page.active{display:block}

/* ===== Map Page ===== */
.top-bar{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:10;position:sticky;top:0}
.city-picker{font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:2px}
.city-picker:hover{opacity:.7}
.city-arrow{font-size:10px;color:#999;transition:transform .2s}
.search-box{flex:1;height:34px;background:#f5f5f5;border-radius:17px;display:flex;align-items:center;padding:0 12px;gap:6px;cursor:pointer}
.search-box span{font-size:13px;color:#999}
.category-scroll{display:flex;gap:8px;padding:10px 16px;background:#fff;overflow-x:auto;border-bottom:1px solid #eee;-webkit-overflow-scrolling:touch}
.cat-chip{padding:5px 14px;border-radius:14px;font-size:12px;white-space:nowrap;background:#f5f5f5;color:#666;cursor:pointer;transition:all .2s;flex-shrink:0}
.cat-chip.active{background:#07C160;color:#fff}
.map-wrap{height:320px;background:#e8f4fd;position:relative;display:flex;align-items:center;justify-content:center;margin:8px 16px;border-radius:12px;overflow:hidden}
.map-placeholder{text-align:center}
.map-placeholder .pin{font-size:40px}
.map-placeholder .hint{font-size:12px;color:#07C160;margin-top:4px}
.locate-btn{position:absolute;right:12px;bottom:12px;width:40px;height:40px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.card-scroll{padding:8px 16px 16px;display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.shop-card{min-width:240px;display:flex;gap:10px;padding:10px;background:#fff;border:2px solid #eee;border-radius:12px;cursor:pointer;transition:all .2s;flex-shrink:0}
.shop-card.active{border-color:#07C160;background:#f0fff4}
.shop-card .thumb{width:72px;height:72px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.shop-card .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.shop-card .name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-card .meta{font-size:11px;color:#999;margin-top:3px}
.shop-card .dist{font-size:11px;color:#07C160;margin-top:2px}
.shop-card .rating{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px}

/* ===== Explore Page ===== */
.search-bar{padding:10px 16px;background:#fff}
.filter-bar{display:flex;gap:24px;padding:0 16px 10px;background:#fff;font-size:14px}
.filter-bar span{color:#666;cursor:pointer;padding-bottom:4px;border-bottom:2px solid transparent}
.filter-bar span.active{color:#07C160;font-weight:600;border-bottom-color:#07C160}
.waterfall{display:flex;gap:10px;padding:10px 12px}
.waterfall-col{flex:1;display:flex;flex-direction:column;gap:10px}
.post-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s}
.post-card:active{transform:scale(.97)}
.post-cover-wrap{position:relative;background:#f0f0f0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px}
.play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:rgba(0,0,0,.45);border-radius:50%;display:flex;align-items:center;justify-content:center}
.play-overlay::after{content:'';width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #fff;margin-left:3px}
.post-title{padding:8px 10px 4px;font-size:12px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.post-meta{padding:0 10px 10px;font-size:10px;color:#999;display:flex;justify-content:space-between}

/* ===== Mine Page ===== */
.user-header{background:#fff;overflow:hidden}
.user-bg{height:80px;background:linear-gradient(135deg,#07C160,#06AD56)}
.user-row{display:flex;align-items:center;padding:0 16px 16px;margin-top:-30px;gap:12px}
.user-avatar{width:70px;height:70px;border-radius:50%;border:3px solid #fff;background:#f0f0f0;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;cursor:pointer}
.user-name{font-size:18px;font-weight:700;margin-top:30px}
.user-desc{font-size:12px;color:#999}
.edit-tag{padding:5px 12px;border:1px solid #07C160;border-radius:14px;font-size:12px;color:#07C160;margin-top:30px;margin-left:auto;cursor:pointer}
.stats-row{display:flex;background:#fff;margin:10px 0;padding:20px 0}
.stat-item{flex:1;text-align:center;cursor:pointer}
.stat-num{font-size:24px;font-weight:700}
.stat-label{font-size:12px;color:#999;margin-top:4px}
.stat-divider{width:1px;height:36px;background:#eee;align-self:center}
.menu-list{background:#fff;margin-bottom:10px}
.menu-item{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:15px}
.menu-item:last-child{border-bottom:none}
.menu-arrow{color:#ccc;font-size:18px}
.btn-login{display:block;width:80%;margin:40px auto;height:46px;background:linear-gradient(135deg,#07C160,#06AD56);color:#fff;font-size:16px;border:none;border-radius:23px;cursor:pointer}
.login-area{text-align:center;padding:20px}

/* ===== Detail Pages ===== */
.detail-page{position:fixed;top:0;left:50%;transform:translateX(-50%);width:414px;max-width:100vw;height:100vh;background:#f6f6f6;z-index:1500;display:none;flex-direction:column;overflow-y:auto}
.detail-page.show{display:flex}
.detail-header{display:flex;align-items:center;padding:10px 16px;background:#fff;gap:12px;position:sticky;top:0;z-index:10}
.detail-back{font-size:22px;cursor:pointer;color:#333;width:30px}
.detail-title{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-cover{width:100%;max-height:260px;object-fit:cover;background:#f0f0f0}
.detail-section{background:#fff;margin:8px 0;padding:14px 16px}
.detail-section .section-title{font-size:14px;font-weight:600;margin-bottom:8px}
.detail-name{font-size:20px;font-weight:700;margin-bottom:8px}
.detail-meta{font-size:13px;color:#666;margin-bottom:6px}
.btn-primary{display:block;width:calc(100% - 32px);margin:10px 16px;height:44px;background:#07C160;color:#fff;font-size:15px;border:none;border-radius:22px;cursor:pointer}
.btn-secondary{display:block;width:calc(100% - 32px);margin:0 16px 10px;height:44px;background:#FFD100;color:#333;font-size:15px;border:none;border-radius:22px;cursor:pointer}

/* ===== City Picker Panel ===== */
.city-panel{position:fixed;top:0;left:50%;transform:translateX(-50%);width:414px;max-width:100vw;height:100vh;background:#fff;z-index:1800;display:none;flex-direction:column}
.city-panel.show{display:flex}
.city-panel-header{display:flex;align-items:center;padding:10px 16px;gap:10px;border-bottom:1px solid #eee}
.city-panel-back{font-size:22px;cursor:pointer;color:#333}
.city-search-wrap{flex:1;display:flex;align-items:center;height:36px;background:#f5f5f5;border-radius:18px;padding:0 12px;gap:6px}
.city-search-wrap input{flex:1;border:none;background:transparent;font-size:14px;color:#333;outline:none}
.city-search-wrap .clear-btn{width:22px;height:22px;border-radius:50%;background:#ccc;color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.city-search-wrap .clear-btn.visible{display:flex}
.search-results{flex:1;overflow-y:auto}
.search-results .result-item{padding:14px 16px;font-size:15px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.search-results .result-item:active{background:#f5f5f5}
.city-content{flex:1;display:flex;overflow:hidden;position:relative}
.city-content.searching{display:none}
.current-city-row{padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.current-city-row .label{font-size:11px;color:#999}
.current-city-row .name{font-size:16px;font-weight:600;margin-top:4px;display:flex;justify-content:space-between}
.current-city-row .reload{font-size:13px;color:#07C160}
.hot-section{padding:12px 16px;border-bottom:1px solid #f0f0f0}
.hot-section .label{font-size:11px;color:#999;margin-bottom:8px}
.hot-grid{display:flex;flex-wrap:wrap;gap:8px}
.hot-chip{padding:6px 16px;background:#f5f5f5;border-radius:6px;font-size:13px;cursor:pointer}
.hot-chip:active{background:#e0e0e0}
.city-scroll-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.city-group .letter-header{padding:6px 16px;font-size:12px;color:#999;background:#f6f6f6;position:sticky;top:0}
.city-group .city-row{padding:14px 16px;font-size:15px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.city-group .city-row:active{background:#f5f5f5}
.letter-index{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;z-index:10}
.letter-index .idx-dot{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666;border-radius:50%;cursor:pointer}
.letter-index .idx-dot.active{color:#fff;background:#07C160;font-weight:700}
.letter-tooltip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:rgba(0,0,0,.65);color:#fff;font-size:28px;border-radius:8px;display:none;align-items:center;justify-content:center;z-index:1900;pointer-events:none}
.letter-tooltip.show{display:flex}

/* ===== Toast ===== */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:3000;display:none;pointer-events:none}
.toast.show{display:block;animation:toastIn .2s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

.sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;z-index:2000}
.sheet-overlay.show{display:block}
.sheet-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:414px;max-width:100vw;background:#fff;border-radius:16px 16px 0 0;padding:12px 0 24px;z-index:2001}
.sheet-item{padding:14px 20px;font-size:16px;text-align:center;cursor:pointer}
.sheet-item:active{background:#f5f5f5}
.sheet-cancel{margin-top:8px;border-top:6px solid #f5f5f5;padding-top:14px;color:#999}

@media(max-width:414px){body::before{display:none}.tabbar{left:0;transform:none}.detail-page,.city-panel{left:0;transform:none}.sheet-panel{left:0;transform:none}}
</style>
</head>
<body>

<!-- ======== MAP PAGE ======== -->
<div class="page active" id="page-map">
  <div class="top-bar">
    <div class="city-picker" onclick="openCityPicker()"><span id="currentCityName">杭州市</span> <span class="city-arrow">▼</span></div>
    <div class="search-box" onclick="showToast('搜索(开发中)')"><span>🔍 搜索美食、商圈、地址</span></div>
  </div>
  <div class="category-scroll" id="catBar">
    <div class="cat-chip active" data-cat="全部" onclick="filterCategory(this)">全部</div>
    <div class="cat-chip" data-cat="火锅" onclick="filterCategory(this)">火锅</div>
    <div class="cat-chip" data-cat="日料" onclick="filterCategory(this)">日料</div>
    <div class="cat-chip" data-cat="烧烤" onclick="filterCategory(this)">烧烤</div>
    <div class="cat-chip" data-cat="咖啡" onclick="filterCategory(this)">咖啡</div>
    <div class="cat-chip" data-cat="甜品" onclick="filterCategory(this)">甜品</div>
    <div class="cat-chip" data-cat="川菜" onclick="filterCategory(this)">川菜</div>
    <div class="cat-chip" data-cat="小吃" onclick="filterCategory(this)">小吃</div>
  </div>
  <div class="map-wrap" id="mapWrap">
    <div class="map-placeholder">
      <div class="pin">🗺️</div>
      <div style="font-size:13px;color:#666;margin-top:4px">高德地图 · 周边美食</div>
      <div class="hint" id="mapHint">点击下方卡片查看Marker</div>
    </div>
    <div class="locate-btn" onclick="showToast('定位中...')">📍</div>
  </div>
  <div class="card-scroll" id="cardScroll"></div>
</div>

<!-- ======== EXPLORE PAGE ======== -->
<div class="page" id="page-explore">
  <div class="search-bar"><div class="search-box" onclick="showToast('搜索(开发中)')"><span>🔍 搜索探店笔记标题、地点</span></div></div>
  <div class="filter-bar">
    <span class="active" data-sort="latest" onclick="sortPosts(this)">最新发布</span>
    <span data-sort="popular" onclick="sortPosts(this)">最多收藏</span>
    <span data-sort="views" onclick="sortPosts(this)">最多浏览</span>
  </div>
  <div class="category-scroll">
    <div class="cat-chip active" data-cat="全部" onclick="filterExploreCat(this)">全部</div>
    <div class="cat-chip" data-cat="火锅" onclick="filterExploreCat(this)">火锅</div>
    <div class="cat-chip" data-cat="日料" onclick="filterExploreCat(this)">日料</div>
    <div class="cat-chip" data-cat="烧烤" onclick="filterExploreCat(this)">烧烤</div>
    <div class="cat-chip" data-cat="咖啡" onclick="filterExploreCat(this)">咖啡</div>
  </div>
  <div class="waterfall" id="waterfall"></div>
</div>

<!-- ======== MINE PAGE ======== -->
<div class="page" id="page-mine">
  <div class="user-header">
    <div class="user-bg"></div>
    <div class="user-row">
      <div class="user-avatar" onclick="onEditProfile()">👤</div>
      <div><div class="user-name" id="displayName">美食爱好者</div><div class="user-desc">点击登录享受更多功能</div></div>
      <div class="edit-tag" onclick="onEditProfile()">编辑资料</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-item" onclick="switchTab('explore')"><div class="stat-num" id="favCount">0</div><div class="stat-label">收藏</div></div>
    <div class="stat-divider"></div>
    <div class="stat-item" onclick="switchTab('explore')"><div class="stat-num" id="histCount">0</div><div class="stat-label">浏览记录</div></div>
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="showToast('收藏列表(开发中)')"><span>❤️ 我的收藏</span><span class="menu-arrow">›</span></div>
    <div class="menu-item" onclick="showToast('浏览记录(开发中)')"><span>🕐 浏览记录</span><span class="menu-arrow">›</span></div>
    <div class="menu-item" onclick="onEditProfile()"><span>⚙️ 设置</span><span class="menu-arrow">›</span></div>
    <div class="menu-item" onclick="showToast('关于美食地图')"><span>ℹ️ 关于美食地图</span><span class="menu-arrow">›</span></div>
  </div>
  <div class="login-area"><button class="btn-login" onclick="doLogin()">微信一键登录 (Demo)</button></div>
</div>

<!-- ======== CITY PICKER PANEL ======== -->
<div class="city-panel" id="cityPanel">
  <div class="city-panel-header">
    <div class="city-panel-back" onclick="closeCityPicker()">←</div>
    <div class="city-search-wrap">
      <span style="font-size:14px">🔍</span>
      <input type="text" id="citySearchInput" placeholder="搜索城市名" oninput="onCitySearch(this.value)">
      <div class="clear-btn" id="clearSearchBtn" onclick="clearCitySearch()">✕</div>
    </div>
  </div>
  <div class="search-results" id="searchResults" style="display:none"></div>
  <div class="city-content" id="cityContent">
    <div class="current-city-row" onclick="selectCity(currentCity)">
      <div class="label">当前定位</div>
      <div class="name"><span>📍 <span id="cpCurrentName">杭州市</span></span><span class="reload">⟳</span></div>
    </div>
    <div class="hot-section">
      <div class="label">热门城市</div>
      <div class="hot-grid" id="hotGrid"></div>
    </div>
    <div class="city-scroll-wrap" id="cityScrollWrap"></div>
    <div class="letter-index" id="letterIndex"></div>
  </div>
  <div class="letter-tooltip" id="letterTooltip"></div>
</div>

<!-- ======== TAB BAR ======== -->
<div class="tabbar">
  <div class="tab-item active" data-tab="map" onclick="switchTab('map')"><span class="tab-icon">🗺️</span><span>地图</span></div>
  <div class="tab-item" data-tab="explore" onclick="switchTab('explore')"><span class="tab-icon">📹</span><span>探店</span></div>
  <div class="tab-item" data-tab="mine" onclick="switchTab('mine')"><span class="tab-icon">👤</span><span>我的</span></div>
</div>

<!-- ======== SHOP DETAIL ======== -->
<div class="detail-page" id="shopDetail">
  <div class="detail-header"><div class="detail-back" onclick="closeDetail('shopDetail')">←</div><div class="detail-title" id="shopDetailTitle">店铺详情</div></div>
  <img class="detail-cover" id="shopDetailImg" src="" alt="">
  <div class="detail-section">
    <div class="detail-name" id="shopDetailName"></div>
    <div class="detail-meta" id="shopDetailMeta"></div>
    <div class="detail-meta" id="shopDetailAddr"></div>
  </div>
  <div class="detail-section"><div class="section-title">📍 附近位置</div><div style="height:160px;background:#e8f4fd;border-radius:8px;display:flex;align-items:center;justify-content:center">点击查看地图导航</div></div>
  <button class="btn-primary" onclick="showToast('已跳转地图导航')">🧭 跳转地图导航</button>
  <button class="btn-secondary" onclick="showToast('已复制美团团购链接')">🛒 查看美团团购</button>
</div>

<!-- ======== POST DETAIL ======== -->
<div class="detail-page" id="postDetail">
  <div class="detail-header"><div class="detail-back" onclick="closeDetail('postDetail')">←</div><div class="detail-title" id="postDetailTitle">探店详情</div></div>
  <div style="position:relative;cursor:pointer" onclick="showToast('视频链接已复制，请到外部平台观看')">
    <img class="detail-cover" id="postDetailImg" src="" alt="">
    <div class="play-overlay" style="width:56px;height:56px;background:rgba(0,0,0,.5)"></div>
  </div>
  <div class="detail-section"><div class="detail-name" id="postDetailName"></div><div class="detail-meta" id="postDetailStats"></div></div>
  <div class="detail-section">
    <div class="section-title">作者</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:40px;height:40px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>
      <div><div style="font-weight:600" id="postAuthor"></div><div style="font-size:11px;color:#07C160">探店达人</div></div>
    </div>
  </div>
  <div class="detail-section" id="postShopCard"></div>
  <div style="position:sticky;bottom:0;background:#fff;display:flex;border-top:1px solid #eee">
    <div class="tab-item" id="favBtn" onclick="toggleFav()" style="padding:10px 0;font-size:13px">🤍 收藏</div>
    <div class="tab-item" style="padding:10px 0;font-size:13px;border-left:1px solid #eee">📤 分享</div>
  </div>
</div>

<!-- ======== TOAST & SHEET ======== -->
<div class="toast" id="toast"></div>
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet-panel" id="sheetPanel">
  <div class="sheet-item" onclick="changeNickname()">修改昵称</div>
  <div class="sheet-item" onclick="showToast('头像上传(开发中)')">更换头像</div>
  <div class="sheet-cancel sheet-item" onclick="closeSheet()">取消</div>
</div>

<script>
// ============ CITY DATA ============
var CITY_LIST = [
  {name:"北京市",pinyin:"beijing",letter:"B",lat:39.9042,lng:116.4074},
  {name:"上海市",pinyin:"shanghai",letter:"S",lat:31.2304,lng:121.4737},
  {name:"广州市",pinyin:"guangzhou",letter:"G",lat:23.1291,lng:113.2644},

// build city groups
function buildCityData(){
  var groups={};
  CITY_LIST.forEach(function(c){
    if(!groups[c.letter]) groups[c.letter]=[];
    groups[c.letter].push(c);
  });
  var letters=Object.keys(groups).sort();
  var html='';
  letters.forEach(function(l){
    html+='<div class="city-group" id="cg-'+l+'"><div class="letter-header">'+l+'</div>';
    groups[l].forEach(function(c){html+='<div class="city-row" onclick="selectCity(autoCity(\''+c.name+'\'))">'+c.name+'</div>'});
    html+='</div>';
  });
  document.getElementById('cityScrollWrap').innerHTML=html;

  var idxHtml='';
  letters.forEach(function(l){idxHtml+='<div class="idx-dot" data-letter="'+l+'" onclick="scrollToLetter(\''+l+'\')">'+l+'</div>'});
  document.getElementById('letterIndex').innerHTML=idxHtml;

  var hotHtml='';
  HOT_NAMES.forEach(function(n){
    var c=CITY_LIST.find(function(x){return x.name===n});
    if(c) hotHtml+='<div class="hot-chip" onclick="selectCity(autoCity(\''+c.name+'\'))">'+n+'</div>';
  });
  document.getElementById('hotGrid').innerHTML=hotHtml;
}

function autoCity(name){return CITY_LIST.find(function(c){return c.name===name})}

function onCitySearch(val){
  var kw=val.trim().toLowerCase();
  var clearBtn=document.getElementById('clearSearchBtn');
  var searchRes=document.getElementById('searchResults');
  var cityContent=document.getElementById('cityContent');

  if(kw){
    clearBtn.classList.add('visible');
    var results=CITY_LIST.filter(function(c){return c.name.indexOf(val)!==-1||c.pinyin.indexOf(kw)!==-1});
    var html='';
    if(results.length===0)html='<div style="text-align:center;padding:60px 0;color:#999">未找到匹配城市</div>';
    else results.forEach(function(c){html+='<div class="result-item" onclick="selectCity(autoCity(\''+c.name+'\'))">'+c.name+'</div>'});
    searchRes.innerHTML=html;
    searchRes.style.display='block';
    cityContent.classList.add('searching');
  }else{
    clearBtn.classList.remove('visible');
    searchRes.style.display='none';
    cityContent.classList.remove('searching');
  }
}

function clearCitySearch(){
  document.getElementById('citySearchInput').value='';
  onCitySearch('');
}

function scrollToLetter(letter){
  var el=document.getElementById('cg-'+letter);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  showLetterTooltip(letter);
}

// Letter index touch handling
(function(){
  var tooltip=document.getElementById('letterTooltip');
  var letterIdx=document.getElementById('letterIndex');
  var scrollWrap=document.getElementById('cityScrollWrap');
  var dots,letters=[];

  function getDots(){dots=letterIdx.querySelectorAll('.idx-dot');letters=[];dots.forEach(function(d){letters.push(d.dataset.letter)});return dots}

  letterIdx.addEventListener('touchstart',function(e){
    getDots();handleTouch(e);
  });
  letterIdx.addEventListener('touchmove',function(e){
    e.preventDefault();handleTouch(e);
  });
  letterIdx.addEventListener('touchend',function(){
    tooltip.classList.remove('show');
  });

  function handleTouch(e){
    var touch=e.touches[0];
    var ds=getDots();
    ds.forEach(function(d,i){
      var r=d.getBoundingClientRect();
      if(touch.clientY>=r.top&&touch.clientY<=r.bottom&&letters[i]){
        scrollToLetter(letters[i]);
      }
    });
  }

  function showLetterTooltip(l){
    tooltip.textContent=l;tooltip.classList.add('show');
    clearTimeout(tooltip._t);
    tooltip._t=setTimeout(function(){tooltip.classList.remove('show')},600);
  }
})();

function renderShopCards(filter){
  var cat=filter||'全部';
  var filtered=shopData.filter(function(s){return cat==='全部'||s.category===cat});
  var html=filtered.map(function(s){
    return '<div class="shop-card" id="card-'+s.id+'" onclick="openShopDetail(\''+s.id+'\')">'+

// ============ EXPLORE ============
function renderPosts(sort,cat){
  var list=postData.slice();
  if(cat&&cat!=='全部'){list=list.filter(function(p){var s=findShop(p.shopId);return s&&s.category===cat})}
  if(sort==='popular'){list.sort(function(a,b){return b.favs-a.favs})}
  else if(sort==='views'){list.sort(function(a,b){return b.views-a.views})}
  var left=[],right=[];
  list.forEach(function(p,i){if(i%2===0)left.push(p);else right.push(p)});
  [left,right].forEach(function(col,ci){
    var h=col.map(function(p){
      return '<div class="post-card" onclick="openPostDetail(\''+p.id+'\')">'+
        '<div class="post-cover-wrap" style="height:'+(140+Math.random()*60)+'px">'+p.cover+'</div>'+
        '<div class="post-title">'+p.title+'</div><div class="post-meta"><span>'+p.author+'</span><span>'+p.views+' 浏览</span></div></div>';
    }).join('');
    document.querySelectorAll('#waterfall .waterfall-col')[ci].innerHTML=h;
  });
}

function sortPosts(el){
  el.parentElement.querySelectorAll('span').forEach(function(s){s.classList.remove('active')});
  el.classList.add('active');
  renderPosts(el.dataset.sort);
}

  el.parentElement.querySelectorAll('.cat-chip').forEach(function(c){c.classList.remove('active')});
